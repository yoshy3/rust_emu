<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust NES Emulator - Premium Web Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      font-family: 'Outfit', sans-serif;
      background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, var(--bg-color) 70%);
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.8s ease-out;
      width: fit-content;
    }

    h1 {
      margin: 0 0 8px 0;
      font-weight: 600;
      font-size: 2.5rem;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #94a3b8);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #status {
      margin-bottom: 24px;
      color: var(--text-dim);
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    canvas {
      image-rendering: pixelated;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 0 40px var(--accent-glow);
      width: 768px;
      height: 720px;
      transition: transform 0.3s ease;
    }

    canvas:hover {
      transform: scale(1.02);
    }

    .controls-hint {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .key-cap {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      font-weight: 600;
      margin-right: 6px;
    }

    #drop-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 4px dashed var(--accent-color);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 2.5rem;
      pointer-events: none;
      color: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #drop-overlay svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      stroke: var(--accent-color);
      animation: float 2s infinite ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>NES Emulator</h1>
    <div id="status">Loading Wasm...</div>
    <canvas id="nes-canvas" width="256" height="240"></canvas>

    <div class="controls-hint">
      <div><span class="key-cap">Z</span> A</div>
      <div><span class="key-cap">X</span> B</div>
      <div><span class="key-cap">Enter</span> Start</div>
      <div><span class="key-cap">Shift</span> Select</div>
      <div><span class="key-cap">↑↓←→</span> D-Pad</div>
    </div>
    <div id="version"
      style="position: absolute; bottom: 10px; right: 10px; color: var(--text-dim); font-size: 0.8rem; opacity: 0.7;">
    </div>
  </div>

  <div id="drop-overlay">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
    </svg>
    Drop .nes ROM to play
  </div>

  <script type="module">
    import init, { Nes, get_version } from './pkg/rust_emu.js';

    async function run() {
      const statusEl = document.getElementById('status');
      const versionEl = document.getElementById('version');
      const overlay = document.getElementById('drop-overlay');
      const canvas = document.getElementById('nes-canvas');
      const ctx = canvas.getContext('2d');
      const width = 256;
      const height = 240;
      const imageData = ctx.createImageData(width, height);
      const data = imageData.data;

      console.log("[JS] Starting run()...");
      try {
        await init();
        console.log("[JS] Wasm initialized.");
        statusEl.innerText = "Drag & Drop a .nes file here";
        versionEl.innerText = "v" + get_version();
      } catch (e) {
        console.error("[JS] Wasm init failed:", e);
        statusEl.innerText = "Error initializing Wasm.";
        return;
      }

      const nes = Nes.new();
      nes.reset();

      // DRAG & DROP
      let dragCounter = 0;

      const handleDragEnter = (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter++;
        overlay.style.display = 'flex';
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'copy';
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          overlay.style.display = 'none';
        }
      };

      const handleDrop = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter = 0;
        overlay.style.display = 'none';

        const file = e.dataTransfer.files[0];
        if (!file) return;

        initAudio();

        if (file.name.toLowerCase().endsWith('.nes')) {
          try {
            statusEl.innerText = "Loading " + file.name + "...";
            const arrayBuffer = await file.arrayBuffer();
            const romData = new Uint8Array(arrayBuffer);
            nes.load_rom(romData);
            statusEl.innerText = "Playing: " + file.name;
          } catch (err) {
            console.error("[D&D] Error loading ROM:", err);
            statusEl.innerText = "Load failed.";
          }
        } else {
          alert("Please drop a .nes file.");
        }
      };

      window.addEventListener('dragenter', handleDragEnter);
      window.addEventListener('dragover', handleDragOver);
      window.addEventListener('dragleave', handleDragLeave);
      window.addEventListener('drop', handleDrop);

      // KEYS
      const keyMap = {
        'z': 0, 'x': 1, 'Shift': 2, 'Enter': 3,
        'ArrowUp': 4, 'ArrowDown': 5, 'ArrowLeft': 6, 'ArrowRight': 7
      };
      const keyboardState = new Array(8).fill(false);
      const gamepadState = new Array(8).fill(false);
      const previousGamepadButtons = [];
      const previousGamepadAxes = [];

      const logGamepadChanges = (gamepad) => {
        for (let i = 0; i < gamepad.buttons.length; i++) {
          const button = gamepad.buttons[i];
          const pressed = !!button && (button.pressed || button.value >= 0.5);
          if (previousGamepadButtons[i] !== pressed) {
            previousGamepadButtons[i] = pressed;
            if (pressed) {
              console.log("[Input] Gamepad button pressed:", {
                id: gamepad.id,
                index: i,
                value: button.value,
                mapping: gamepad.mapping,
              });
            }
          }
        }

        for (let i = 0; i < gamepad.axes.length; i++) {
          const value = gamepad.axes[i] ?? 0;
          const previous = previousGamepadAxes[i] ?? 0;
          if (Math.abs(value - previous) >= 0.5) {
            previousGamepadAxes[i] = value;
            console.log("[Input] Gamepad axis changed:", {
              id: gamepad.id,
              index: i,
              value,
              mapping: gamepad.mapping,
            });
          }
        }
      };

      const applyJoypadState = () => {
        for (let i = 0; i < 8; i++) {
          nes.set_joypad_button_wasm(i, keyboardState[i] || gamepadState[i]);
        }
      };

      const axisNear = (value, target, tolerance = 0.2) => Math.abs(value - target) <= tolerance;

      const pollGamepad = () => {
        gamepadState.fill(false);
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const gamepad = Array.from(gamepads).find((pad) => pad && pad.connected);
        if (!gamepad) {
          return;
        }

        logGamepadChanges(gamepad);

        const buttonPressed = (index) => {
          const button = gamepad.buttons[index];
          return !!button && (button.pressed || button.value >= 0.5);
        };
        const axisValue = (index) => gamepad.axes[index] ?? 0;
        const isFirefoxRawMapping = gamepad.mapping === '';
        const isFirefoxRawXbox = isFirefoxRawMapping && gamepad.id.includes('Xbox Wireless Controller');

        if (isFirefoxRawXbox) {
          gamepadState[0] = buttonPressed(0); // NES A <- A
          gamepadState[1] = buttonPressed(3); // NES B <- X
          gamepadState[2] = buttonPressed(10); // Select <- View
          gamepadState[3] = buttonPressed(11); // Start <- Menu
          gamepadState[4] = axisValue(1) <= -0.5;
          gamepadState[5] = axisValue(1) >= 0.5;
          gamepadState[6] = axisValue(0) <= -0.5;
          gamepadState[7] = axisValue(0) >= 0.5;
          return;
        }

        gamepadState[0] = buttonPressed(0); // NES A <- South / A
        gamepadState[1] = buttonPressed(2); // NES B <- West / X
        gamepadState[2] = buttonPressed(8); // Select <- Back / View
        gamepadState[3] = buttonPressed(9); // Start <- Start / Menu
        gamepadState[4] = buttonPressed(12) || axisValue(1) <= -0.5;
        gamepadState[5] = buttonPressed(13) || axisValue(1) >= 0.5;
        gamepadState[6] = buttonPressed(14) || axisValue(0) <= -0.5;
        gamepadState[7] = buttonPressed(15) || axisValue(0) >= 0.5;
      };

      window.addEventListener('gamepadconnected', (e) => {
        console.log("[Input] Gamepad connected:", e.gamepad.id);
      });
      window.addEventListener('gamepaddisconnected', (e) => {
        console.log("[Input] Gamepad disconnected:", e.gamepad.id);
      });

      window.addEventListener('keydown', (e) => {
        initAudio();
        if (keyMap[e.key] !== undefined) {
          e.preventDefault();
          keyboardState[keyMap[e.key]] = true;
          applyJoypadState();
        }
      });
      window.addEventListener('keyup', (e) => {
        if (keyMap[e.key] !== undefined) {
          e.preventDefault();
          keyboardState[keyMap[e.key]] = false;
          applyJoypadState();
        }
      });

      // AUDIO SETUP
      let audioCtx = null;
      let nextAudioTime = 0;

      const initAudio = () => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
          nextAudioTime = audioCtx.currentTime;
          console.log("[Audio] Context initialized.");
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
          console.log("[Audio] Context resumed.");
        }
      };

      // LOOP
      let lastTime = performance.now();
      let cycleDebt = 0;
      const CPU_CLOCK = 1789773;

      function step(currentTime) {
        try {
          pollGamepad();
          applyJoypadState();

          const dt = (currentTime - lastTime) / 1000.0;
          lastTime = currentTime;

          const effectiveDt = Math.min(dt, 0.1);
          cycleDebt += effectiveDt * CPU_CLOCK;

          while (cycleDebt >= 1) {
            const cycles = nes.tick();
            cycleDebt -= cycles;
            if (cycleDebt > 1000000) { cycleDebt = 0; break; }
          }

          // Audio playback
          if (audioCtx) {
            const audioSamples = nes.get_audio_samples();
            if (audioSamples && audioSamples.length > 0) {
              const buffer = audioCtx.createBuffer(1, audioSamples.length, 44100);
              buffer.getChannelData(0).set(audioSamples);
              const source = audioCtx.createBufferSource();
              source.buffer = buffer;
              source.connect(audioCtx.destination);

              const startTime = Math.max(nextAudioTime, audioCtx.currentTime);
              source.start(startTime);
              nextAudioTime = startTime + buffer.duration;

              // Prevent buffer bloat if audio falls behind
              if (nextAudioTime > audioCtx.currentTime + 0.1) {
                nextAudioTime = audioCtx.currentTime;
              }
            }
          }

          const buffer = new Uint8Array(width * height * 4);
          nes.draw(buffer);
          data.set(buffer);
          ctx.putImageData(imageData, 0, 0);
        } catch (e) {
          console.error("[LOOP] Emulation error:", e);
          return;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    run().catch(e => console.error("[JS] Fatal error:", e));
  </script>
</body>

</html>
